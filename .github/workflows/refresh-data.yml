# Keeps the numbers on the page true.
#
# Two things drift: the repository counters (commits, tags, npm versions) and
# the keryx dashboard the site shows a picture of. Both are refreshed here, and
# a commit is made only when a value actually moved — the screenshot re-renders
# byte-differently every time, so committing it unconditionally would rebuild
# the site every night for nothing.
name: refresh figures

on:
  schedule:
    - cron: "17 4 * * *"      # nightly, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # ---- the repository counters -------------------------------------
      - name: Fetch profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/fetch-profile.ts

      # ---- the dashboard the site shows --------------------------------
      # Allowed to fail: a broken keryx build should not hold back a figure
      # refresh that has nothing to do with it.
      - name: Re-shoot the keryx dashboard
        id: dashboard
        continue-on-error: true
        run: |
          bunx playwright install --with-deps chromium
          git clone --depth 1 https://github.com/MrCipherSmith/keryx.git "$RUNNER_TEMP/keryx"
          cd "$RUNNER_TEMP/keryx"
          # health reads eslint and tsc from the project's own dependencies.
          # Without them it reports INCOMPLETE, the dashboard shows a warning
          # that belongs to this runner rather than to keryx, and the header
          # has no score to read — so the shot fails and the site keeps a stale
          # picture. Measured at under a second for 221 packages.
          bun install --frozen-lockfile
          bunx --bun @mrciphersmith/keryx gdgraph build
          bunx --bun @mrciphersmith/keryx health run
          bunx --bun @mrciphersmith/keryx dashboard build
          cd "$GITHUB_WORKSPACE"
          bun run scripts/shoot-dashboard.ts "$RUNNER_TEMP/keryx/.metaproject/keryx-dashboard.html"

      - name: Report a failed re-shoot without failing the run
        if: steps.dashboard.outcome == 'failure'
        run: echo "::warning::the dashboard could not be re-shot; the picture and its caption stay as they were"

      # ---- publish only what moved -------------------------------------
      - name: Commit if anything moved
        run: |
          if git diff --quiet -- data public; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "chore(data): refresh figures$(git diff --cached --name-only | grep -q dashboard && echo ' and dashboard shot' || true)"
          git push
